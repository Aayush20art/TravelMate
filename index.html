
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%236366f1' d='M12 19l9 2-9-18-9 18 9-2zm0 0v-8'/></svg>">

    <title>TravelMate</title>
    
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #0c0a2d;
        color: white;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes gradient-bg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient {
        background-size: 200% 200%;
        animation: gradient-bg 15s ease infinite;
      }
      .glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      
      /* Global Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0c0a2d;
      }
      ::-webkit-scrollbar-thumb {
        background: #e11d48;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #fb7185;
      }

      /* Inner Scoped Custom Scrollbar for Containers */
      .custom-scrollbar {
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: rgba(34, 211, 238, 0.3) transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(34, 211, 238, 0.3);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(34, 211, 238, 0.5);
      }

      /* Button Glow Effect */
      .btn-glow:hover {
        box-shadow: 0 0 30px rgba(34, 211, 238, 0.6), 0 0 60px rgba(217, 70, 239, 0.3);
      }

      @keyframes float-img {
        0% { opacity: 0; transform: scale(1.1) translateY(20px); }
        10% { opacity: 0.1; }
        90% { opacity: 0.1; }
        100% { opacity: 0; transform: scale(1) translateY(-20px); }
      }
    </style>
  <script type="importmap">

    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>

</head>

</html>
